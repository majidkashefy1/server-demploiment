name: Add ops key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  key:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install sshpass
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

      - name: Install ops public key
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          OPS_KEY: ${{ vars.OPS_PUBKEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          sshpass -e ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=25 "$SSH_USER@$SSH_HOST" "umask 077; mkdir -p /root/.ssh; touch /root/.ssh/authorized_keys; grep -qF '$OPS_KEY' /root/.ssh/authorized_keys || echo '$OPS_KEY' >> /root/.ssh/authorized_keys; echo '--- keys ---'; ssh-keygen -lf /root/.ssh/authorized_keys"
