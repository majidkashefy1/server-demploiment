name: Inspect edge config

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install sshpass
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

      - name: Read Caddy fragments and images
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          sshpass -e ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=25 "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set +e
          echo "===== EDGE DIR ====="
          ls -la /opt/projects/edge
          echo "===== MAIN CADDYFILE ====="
          sed -E 's/(token|secret|password|basicauth|api[_-]?key|authorization)[^ ]*.*/\1 [redacted]/Ig' /opt/projects/edge/Caddyfile
          echo "===== CONF.D ====="
          ls -la /opt/projects/edge/conf.d
          for f in /opt/projects/edge/conf.d/*; do
            echo "--- $f ---"
            sed -E 's/(token|secret|password|basicauth|api[_-]?key|authorization)[^ ]*.*/\1 [redacted]/Ig' "$f"
          done
          echo "===== NODE IMAGES ====="
          docker images | grep -Ei 'node|caddy' || echo "no node/caddy images"
          echo "===== PORTFOLIO CONTAINERS ====="
          docker ps -a --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}' | grep -Ei 'kashefi|portfolio' || echo "none"
          echo "===== EDGE COMPOSE ====="
          find /opt/projects/edge -maxdepth 1 -type f -printf '%f\n'
          echo "===== DONE ====="
          REMOTE
