name: Fix TLS now

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install sshpass
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

      - name: Force certificate retry
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set +e
          mkdir -p ~/.ssh
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSHCMD="sshpass -e ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=25"

          echo "===== CADDY VERSION / MOUNTS ====="
          $SSHCMD "$SSH_USER@$SSH_HOST" "docker exec edge-caddy caddy version; docker inspect edge-caddy --format '{{json .Mounts}}'"

          echo "===== CADDYFILE (global block) ====="
          $SSHCMD "$SSH_USER@$SSH_HOST" "docker exec edge-caddy sed -n '1,40p' /etc/caddy/Caddyfile"

          echo "===== RELOAD ====="
          $SSHCMD "$SSH_USER@$SSH_HOST" "docker exec edge-caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile 2>&1"

          echo "===== WAITING FOR ISSUANCE ====="
          for i in $(seq 1 12); do
            sleep 15
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://kashefimajiddev.com/ 2>/dev/null)
            echo "attempt $i: https apex -> $CODE"
            if [ "$CODE" = "200" ]; then break; fi
          done

          echo "===== CERT ====="
          echo | openssl s_client -connect kashefimajiddev.com:443 -servername kashefimajiddev.com 2>/dev/null | openssl x509 -noout -subject -issuer -dates

          echo "===== ROUTES ====="
          curl -sS -o /dev/null -w 'apex: %{http_code} ssl_verify=%{ssl_verify_result}\n' --max-time 25 https://kashefimajiddev.com/
          curl -sS -o /dev/null -w 'www: %{http_code} -> %{redirect_url}\n' --max-time 25 https://www.kashefimajiddev.com/
          curl -sS -o /dev/null -w 'blog: %{http_code}\n' --max-time 25 https://kashefimajiddev.com/blog
          curl -sS -o /dev/null -w 'article: %{http_code}\n' --max-time 25 https://kashefimajiddev.com/blog/solid-principles
          curl -sS -o /dev/null -w 'sitemap: %{http_code}\n' --max-time 25 https://kashefimajiddev.com/sitemap.xml
          curl -sS -o /dev/null -w 'robots: %{http_code}\n' --max-time 25 https://kashefimajiddev.com/robots.txt
          curl -sS -o /dev/null -w 'contact-empty: %{http_code}\n' --max-time 25 -X POST -H 'content-type: application/json' -d '{}' https://kashefimajiddev.com/api/contact
          curl -sS -o /dev/null -w 'electrical: %{http_code}\n' --max-time 25 https://electrical-calculator.ir/

          echo "===== CADDY LOG ====="
          $SSHCMD "$SSH_USER@$SSH_HOST" "docker logs edge-caddy --since 10m 2>&1 | grep -iE 'kashefimajiddev|obtain|certificate|error' | tail -40"
          echo "===== DONE ====="
