name: Set ops key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  key:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install sshpass
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

      - name: Replace ops public key
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -e
          mkdir -p ~/.ssh
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          sshpass -e ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=25 "$SSH_USER@$SSH_HOST" "
            umask 077
            grep -v 'kashefi-ops-local' /root/.ssh/authorized_keys > /tmp/ak || true
            echo 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOF/xmzyyznxdap8IY6kFzisoQpwTZrwdS0gdwKAhRyN kashefi-ops-local' >> /tmp/ak
            mv /tmp/ak /root/.ssh/authorized_keys
            chmod 600 /root/.ssh/authorized_keys
            ssh-keygen -lf /root/.ssh/authorized_keys
          "
